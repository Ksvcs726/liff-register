<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雄商合作社 | 數位會員卡</title>
  
  <!-- 引入 LINE 官方的 LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 引入條碼產生器套件 JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    /* 載入中畫面 */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #5d408f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 會員卡主體設計 */
    .card-container { background: linear-gradient(135deg, #5d408f 0%, #462c73 100%); width: 100%; max-width: 350px; border-radius: 16px; padding: 25px; color: white; box-shadow: 0 10px 20px rgba(93, 64, 143, 0.2); margin-bottom: 20px; box-sizing: border-box; }
    
    .card-header { margin-bottom: 20px; font-size: 13px; opacity: 0.85; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    
    .student-info { margin-bottom: 25px; }
    .student-name { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; }
    .student-class-id { font-size: 14px; opacity: 0.8; letter-spacing: 0.5px; }
    
    /* 左右對齊的深色餘額區塊 */
    .balance-section { background: rgba(0, 0, 0, 0.25); padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .balance-title { font-size: 14px; opacity: 0.9; }
    .balance-amount { font-size: 24px; font-weight: bold; color: #ffdf00; letter-spacing: 1px; }

    /* 條碼區塊 */
    .barcode-section { background: white; padding: 18px 15px 15px 15px; border-radius: 12px; text-align: center; }
    .barcode-hint { color: #555; font-size: 11px; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; }

    /* 消費歷史紀錄區塊 */
    .history-container { width: 100%; max-width: 350px; background: white; border-radius: 16px; padding: 20px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); box-sizing: border-box; }
    
    /* 藍色光棒標題 */
    .history-title { color: #333; font-size: 15px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #f0f2f5; padding-bottom: 12px; display: flex; align-items: center; }
    .history-title::before { content: ""; display: inline-block; width: 4px; height: 15px; background-color: #1890ff; margin-right: 10px; border-radius: 2px; }
    
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f9f9f9; }
    .history-item:last-child { border-bottom: none; }
    .item-left { display: flex; flex-direction: column; gap: 4px; }
    .item-name { color: #333; font-weight: bold; font-size: 15px; }
    .item-time { color: #999; font-size: 12px; }
    .item-price { color: #ff4d4f; font-weight: bold; font-size: 16px; }
    .empty-state { text-align: center; color: #999; padding: 20px 0; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 載入中動畫 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="color: #5d408f; font-weight: bold;">會員資料讀取中...</div>
  </div>

  <!-- 會員卡介面 -->
  <div class="card-container" id="main-card" style="display: none;">
    <div class="card-header">💳 雄商合作社 - 數位儲值卡</div>
    
    <div class="student-info">
      <div class="student-name" id="ui-name">--</div>
      <div class="student-class-id" id="ui-class-id">-- 班 | 學號：--</div>
    </div>
    
    <div class="balance-section">
      <div class="balance-title">儲值卡餘額</div>
      <div class="balance-amount" id="ui-balance">$ 0</div>
    </div>
    
    <div class="barcode-section">
      <div class="barcode-hint">出示條碼供合作社掃描</div>
      <!-- 🌟 將 max-height 放寬到 90px，讓條碼有空間長高 -->
      <svg id="barcode" style="width: 100%; max-height: 90px;"></svg>
    </div>
  </div>

  <!-- 消費紀錄 -->
  <div class="history-container" id="history-section" style="display: none;">
    <div class="history-title">歷史消費紀錄</div>
    <ul class="history-list" id="ui-history-list">
      <!-- 紀錄會由 JS 動態塞入 -->
    </ul>
  </div>

  <script>
    // 您的 GAS API 網址
    const gasUrl = "https://script.google.com/macros/s/AKfycbzTstvDqugK3Ha0r_qW_Jwezg2ntLsNwkLaXHVDliiZnVE6EyED0X-6YS38FJnUXzSkKQ/exec";
    
    // 您的 LIFF ID
    const myLiffId = "2010945191-8UoHPjVp"; 

    // 初始化 LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: myLiffId });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const uid = profile.userId;
        
        fetchMemberData(uid);

      } catch (err) {
        alert("LIFF 初始化失敗，請確認在 LINE 應用程式內開啟。");
        document.getElementById("loading-screen").innerText = "系統連線錯誤";
      }
    }

    // 向後端請求會員資料
    function fetchMemberData(uid) {
      fetch(gasUrl, {
        method: "POST",
        body: JSON.stringify({ action: "getMemberData", uid: uid })
      })
      .then(res => res.json())
      .then(data => {
        if (data.found) {
          document.getElementById("ui-name").innerText = data.name;
          document.getElementById("ui-class-id").innerText = data.className + " 班 | 學號：" + data.studentId;
          document.getElementById("ui-balance").innerText = "$ " + data.balance;
          
          // 🌟 產生學號條碼 (調整參數)
          JsBarcode("#barcode", data.studentId.toString(), {
            format: "CODE128",     
            displayValue: true,    
            fontSize: 22,          // ⬆️ 字體從 16 放大到 22
            width: 2.5,            // ⬆️ 條碼線條寬度微調 (讓整體變長)
            height: 65,            // ⬆️ 條碼本身高度從 50 放大到 65
            margin: 0              
          });
          
          // 渲染歷史紀錄
          const historyList = document.getElementById("ui-history-list");
          if (data.history && data.history.length > 0) {
            historyList.innerHTML = "";
            data.history.forEach(item => {
              historyList.innerHTML += `
                <li class="history-item">
                  <div class="item-left">
                    <span class="item-name">${item.itemName}</span>
                    <span class="item-time">${item.time}</span>
                  </div>
                  <span class="item-price">-$${item.price}</span>
                </li>
              `;
            });
          } else {
            historyList.innerHTML = '<div class="empty-state">尚無消費紀錄</div>';
          }

          document.getElementById("loading-screen").style.display = "none";
          document.getElementById("main-card").style.display = "block";
          document.getElementById("history-section").style.display = "block";

        } else {
          document.getElementById("loading-screen").innerHTML = `
            <div style="color: #ff4d4f; font-weight: bold; text-align:center; padding: 20px;">
              查無會員資料！<br><br>您可能尚未註冊，或系統發生異常。<br>請關閉此視窗並點擊「點我註冊」。
            </div>
          `;
        }
      })
      .catch(err => {
        document.getElementById("loading-screen").innerText = "網路連線失敗，請稍後再試。";
      });
    }

    // 網頁載入時立刻啟動
    window.onload = function() {
      initializeLiff();
    };
  </script>
</body>
</html>
