<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雄商合作社 | 數位會員卡</title>
  
  <!-- 引入 LINE 官方的 LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 🌟 補回條碼產生器套件 JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    /* 載入中畫面 */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #6B4FA2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 會員卡主體設計 */
    .card-container { background: linear-gradient(135deg, #6B4FA2 0%, #4a3670 100%); width: 100%; max-width: 350px; border-radius: 16px; padding: 25px; color: white; box-shadow: 0 10px 20px rgba(107, 79, 162, 0.3); margin-bottom: 20px; box-sizing: border-box; }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 15px; }
    .card-header h2 { margin: 0; font-size: 18px; font-weight: normal; letter-spacing: 1px; }
    
    .student-info { margin-bottom: 25px; }
    .student-class { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
    .student-name { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
    
    .balance-section { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; }
    .balance-title { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
    .balance-amount { font-size: 32px; font-weight: bold; color: #ffd700; }

    /* 🌟 新增條碼顯示區塊的樣式 */
    .barcode-section { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }

    /* 消費歷史紀錄區塊 */
    .history-container { width: 100%; max-width: 350px; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
    .history-title { color: #333; font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f9f9f9; }
    .history-item:last-child { border-bottom: none; }
    .item-left { display: flex; flex-direction: column; }
    .item-name { color: #333; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .item-time { color: #999; font-size: 12px; }
    .item-price { color: #ff4d4f; font-weight: bold; font-size: 16px; }
    .empty-state { text-align: center; color: #999; padding: 20px 0; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 載入中動畫 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="color: #6B4FA2; font-weight: bold;">會員資料讀取中...</div>
  </div>

  <!-- 會員卡介面 -->
  <div class="card-container" id="main-card" style="display: none;">
    <div class="card-header">
      <h2>雄商合作社</h2>
      <div style="font-size: 12px; opacity: 0.8;">數位會員卡</div>
    </div>
    <div class="student-info">
      <div class="student-class" id="ui-class">--</div>
      <div class="student-name" id="ui-name">--</div>
      <div style="font-size: 14px; opacity: 0.8; margin-top: 5px;" id="ui-id">學號: --</div>
    </div>
    <div class="balance-section">
      <div class="balance-title">目前餘額</div>
      <div class="balance-amount" id="ui-balance">$ 0</div>
    </div>
    
    <!-- 🌟 條碼區塊 -->
    <div class="barcode-section">
      <svg id="barcode" style="width: 100%; max-height: 70px;"></svg>
    </div>
  </div>

  <!-- 消費紀錄 -->
  <div class="history-container" id="history-section" style="display: none;">
    <div class="history-title">📅 近期消費紀錄</div>
    <ul class="history-list" id="ui-history-list">
      <!-- 紀錄會由 JS 動態塞入 -->
    </ul>
  </div>

  <script>
    // 您的 GAS API 網址
    const gasUrl = "https://script.google.com/macros/s/AKfycbzTstvDqugK3Ha0r_qW_Jwezg2ntLsNwkLaXHVDliiZnVE6EyED0X-6YS38FJnUXzSkKQ/exec";
    
    // 您的 LIFF ID
    const myLiffId = "2010945191-8UoHPjVp"; 

    // 初始化 LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: myLiffId });
        
        // 如果使用者還沒登入 LINE (在外部瀏覽器打開的話)，強制要求登入
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 成功取得 LINE 身分
        const profile = await liff.getProfile();
        const uid = profile.userId;
        
        // 拿 UID 去向 GAS 要資料
        fetchMemberData(uid);

      } catch (err) {
        alert("LIFF 初始化失敗，請確認在 LINE 應用程式內開啟。");
        document.getElementById("loading-screen").innerText = "系統連線錯誤";
      }
    }

    // 向後端請求會員資料
    function fetchMemberData(uid) {
      fetch(gasUrl, {
        method: "POST",
        body: JSON.stringify({ action: "getMemberData", uid: uid })
      })
      .then(res => res.json())
      .then(data => {
        if (data.found) {
          // 把資料塞進畫面
          document.getElementById("ui-class").innerText = data.className;
          document.getElementById("ui-name").innerText = data.name;
          document.getElementById("ui-id").innerText = "學號: " + data.studentId;
          document.getElementById("ui-balance").innerText = "$ " + data.balance;
          
          // 🌟 產生學號條碼
          JsBarcode("#barcode", data.studentId.toString(), {
            format: "CODE128",     // 條碼格式
            displayValue: true,    // 顯示下方的數字
            fontSize: 16,          // 數字大小
            width: 2,              // 條碼寬度
            height: 50,            // 條碼高度
            margin: 0              // 邊界
          });
          
          // 渲染歷史紀錄
          const historyList = document.getElementById("ui-history-list");
          if (data.history && data.history.length > 0) {
            historyList.innerHTML = "";
            data.history.forEach(item => {
              historyList.innerHTML += `
                <li class="history-item">
                  <div class="item-left">
                    <span class="item-name">${item.itemName}</span>
                    <span class="item-time">${item.time}</span>
                  </div>
                  <span class="item-price">-$${item.price}</span>
                </li>
              `;
            });
          } else {
            historyList.innerHTML = '<div class="empty-state">尚無消費紀錄</div>';
          }

          // 隱藏載入中，顯示會員卡
          document.getElementById("loading-screen").style.display = "none";
          document.getElementById("main-card").style.display = "block";
          document.getElementById("history-section").style.display = "block";

        } else {
          document.getElementById("loading-screen").innerHTML = `
            <div style="color: #ff4d4f; font-weight: bold; text-align:center; padding: 20px;">
              查無會員資料！<br><br>您可能尚未註冊，或系統發生異常。<br>請關閉此視窗並點擊「點我註冊」。
            </div>
          `;
        }
      })
      .catch(err => {
        document.getElementById("loading-screen").innerText = "網路連線失敗，請稍後再試。";
      });
    }

    // 網頁載入時立刻啟動
    window.onload = function() {
      initializeLiff();
    };
  </script>
</body>
</html>
