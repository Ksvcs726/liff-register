<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雄商合作社 - 帳號註冊</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
      .container { background: white; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
      h2 { font-size: 20px; color: #1DB446; margin-bottom: 20px; text-align: center; font-weight: bold; }
      .form-group { margin-bottom: 20px; }
      label { display: block; font-size: 15px; font-weight: bold; color: #333; margin-bottom: 8px; }
      input { width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; transition: border 0.2s; }
      input:focus { border-color: #1DB446; }
      .help-text { font-size: 13px; color: #888; margin-top: 6px; }
      .btn { width: 100%; background-color: #1DB446; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background-color 0.3s; }
      .btn:active { background-color: #158c36; }
      .btn:disabled { background-color: #bbbbbb; cursor: not-allowed; }
      #message { text-align: center; margin-top: 20px; font-weight: bold; font-size: 14px; color: #ff3333; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>學生註冊綁定</h2>
      
      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>學號</label>
          <input type="text" id="studentId" name="studentId" placeholder="請輸入學號" required>
        </div>
        <div class="form-group">
          <label>驗證碼</label>
          <input type="password" id="verifyCode" name="verifyCode" placeholder="身分證前5碼+生日4碼" required>
          <div class="help-text">範例：身分證 E123456789，生日 08月08日，請輸入 E12340808</div>
        </div>
        
        <button type="submit" class="btn" id="submitBtn" disabled>連線至 LINE...</button>
        <div id="message"></div>
      </form>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      let userUid = "";
      
      // ⚠️ 請務必替換為您最新的 GAS Exec 網址
      const gasUrl = "https://script.google.com/macros/s/AKfycbzTstvDqugK3Ha0r_qW_Jwezg2ntLsNwkLaXHVDliiZnVE6EyED0X-6YS38FJnUXzSkKQ/exec";

      window.onload = function() {
        // 脫離了 GAS，這裡的 LIFF 初始化將會非常順暢！
        liff.init({ liffId: "2010935415-kh7DMjtm" }).then(() => {
          if (liff.isLoggedIn()) {
            const idToken = liff.getDecodedIDToken();
            userUid = (idToken && idToken.sub) ? idToken.sub : liff.getContext().userId;
            
            if (userUid) {
              const btn = document.getElementById('submitBtn');
              btn.disabled = false;
              btn.innerText = '確認送出';
            }
          } else {
            liff.login();
          }
        }).catch(err => {
          document.getElementById('message').innerText = "LIFF 初始化失敗：" + err;
        });
      };

      function handleRegister(event) {
        event.preventDefault(); 
        const btn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('message');
        
        btn.disabled = true;
        btn.innerText = '系統核對中...';
        msgBox.innerText = '';
        
        const formObject = {
          action: "register",
          studentId: document.getElementById('studentId').value,
          verifyCode: document.getElementById('verifyCode').value,
          uid: userUid
        };

        // 使用 text/plain 完美避開 GAS 的 CORS 跨網域阻擋機制
        fetch(gasUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(formObject)
        })
        .then(response => response.text())
        .then(result => {
          msgBox.innerText = result;
          if (result.includes("成功")) {
            msgBox.style.color = '#1DB446';
            btn.style.display = 'none'; 
            setTimeout(() => liff.closeWindow(), 1500);
          } else {
            msgBox.style.color = '#ff3333';
            btn.disabled = false;
            btn.innerText = '確認送出';
          }
        })
        .catch(error => {
          msgBox.innerText = "連線發生錯誤，請稍後再試！";
          msgBox.style.color = '#ff3333';
          btn.disabled = false;
          btn.innerText = '確認送出';
        });
      }
    </script>
  </body>
</html>
